[package]
name = "digiget"
version = "0.1.0"
edition = "2021"
description = "Display digimon sprites in your terminal."
license = "MIT"
readme = "README.md"
categories = ["command-line-interface", "command-line-utilities"]
keywords = ["digimon", "digiget", "terminal", "colorscripts", "cli"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[dependencies]
bimap = "0.6.3"
clap = { version = "4.5.14", features = ["derive"] }
csv = "1.3.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
rand = "0.9.2"
rust-embed = { version = "8.8.0" }
showie = "2.0.1"
terminal_size = "0.4.4"
